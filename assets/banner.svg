<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .badge-label {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      .metric-label {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 12px;
        fill: #cbd5e1;
      }
      .metric-val {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 15px;
        fill: #10b981;
      }

      /* Animations (pure CSS within SVG) */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.25; stroke-dashoffset: 0; }
        50% { opacity: 0.6; stroke-dashoffset: -50; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes barGrow {
        0%, 100% { height: 45px; y: 220px; }
        50% { height: 75px; y: 190px; }
      }
      @keyframes barGrow2 {
        0%, 100% { height: 60px; y: 205px; }
        50% { height: 95px; y: 170px; }
      }
      @keyframes barGrow3 {
        0%, 100% { height: 85px; y: 180px; }
        50% { height: 50px; y: 215px; }
      }

      .floating-card-1 {
        animation: floatSlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-card-2 {
        animation: floatSlow 7s ease-in-out infinite reverse;
        transform-origin: center;
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: pulseBeam 4s linear infinite;
      }
      .bar-anim-1 { animation: barGrow 4s ease-in-out infinite; }
      .bar-anim-2 { animation: barGrow2 4s ease-in-out infinite 1s; }
      .bar-anim-3 { animation: barGrow3 4s ease-in-out infinite 2s; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic Background Graphic: Wave / Spending Flow (Kept in Background behind text) -->
  <g opacity="0.4">
    <path class="flow-line" d="M -50,280 C 250,330 450,210 750,260 C 950,290 1080,220 1250,240" fill="none" stroke="url(#primaryGlow)" stroke-width="3" />
    <path class="flow-line" d="M -50,310 C 280,360 480,250 780,290 C 980,320 1100,260 1250,270" fill="none" stroke="#6366f1" stroke-width="1.5" />
  </g>

  <!-- Dynamic Right-Side Tech Visuals (Kept away from Title/Subtitle) -->
  <g transform="translate(860, 45)">
    <!-- Ambient Blur Halo -->
    <circle cx="160" cy="130" r="120" fill="#6366f1" opacity="0.15" filter="url(#glowFilter)" />

    <!-- Dynamic Bar Graph: Real-time spend metrics -->
    <g opacity="0.85">
      <!-- Base Axis -->
      <line x1="20" y1="265" x2="260" y2="265" stroke="#334155" stroke-width="2" />
      <!-- Animated Bars -->
      <rect class="bar-anim-1" x="35" width="22" rx="4" fill="#38bdf8" opacity="0.9" />
      <rect class="bar-anim-2" x="70" width="22" rx="4" fill="#6366f1" opacity="0.9" />
      <rect class="bar-anim-3" x="105" width="22" rx="4" fill="#10b981" opacity="0.9" />
      <rect class="bar-anim-1" x="140" width="22" rx="4" fill="#a855f7" opacity="0.9" />
      <rect class="bar-anim-2" x="175" width="22" rx="4" fill="#f59e0b" opacity="0.9" />
      <rect class="bar-anim-3" x="210" width="22" rx="4" fill="#38bdf8" opacity="0.9" />
    </g>

    <!-- Floating Spend Card 1 (Virtual Corporate Card) -->
    <g class="floating-card-1" transform="translate(10, 20)">
      <rect width="250" height="135" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" filter="url(#glowFilter)" />
      <!-- Chip & Contactless -->
      <rect x="25" y="25" width="34" height="24" rx="4" fill="#f59e0b" opacity="0.9" />
      <path d="M 75 30 A 8 8 0 0 1 75 44 M 82 25 A 14 14 0 0 1 82 49" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
      <text x="25" y="85" font-family="monospace" font-size="14" fill="#f8fafc" letter-spacing="2">•••• 4829</text>
      <text x="25" y="115" font-family="sans-serif" font-weight="700" font-size="11" fill="#38bdf8">RAMP // BREX CORPCARD</text>
      <text x="180" y="115" font-family="sans-serif" font-weight="700" font-size="11" fill="#10b981">APPROVED</text>
    </g>

    <!-- Floating Spend Card 2 (Receipt OCR / Claim Pill) -->
    <g class="floating-card-2" transform="translate(60, 165)">
      <rect width="220" height="70" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" opacity="0.95" />
      <circle cx="35" cy="35" r="16" fill="#10b981" opacity="0.2" />
      <!-- Checkmark -->
      <path d="M 28 35 L 33 40 L 42 30" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="62" y="30" class="metric-label">Receipt Auto-Scanned</text>
      <text x="62" y="50" class="metric-val">$184.50 • 100% Policy Match</text>
    </g>
  </g>

  <!-- Foreground Content: Header, Badges & Subtitle (Guaranteed in Foreground) -->
  <g transform="translate(70, 70)">
    <!-- Category Pill -->
    <g transform="translate(0, 0)">
      <rect width="265" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="16" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" class="badge-label">ENTERPRISE SPEND ECOSYSTEM</text>
    </g>

    <!-- Main Title with Gradient Glow Fill -->
    <text x="0" y="90" class="title-text">
      Awesome Expense Management
    </text>

    <!-- Decorative Underline Gradient -->
    <rect x="0" y="110" width="520" height="4" rx="2" fill="url(#primaryGlow)" />

    <!-- Descriptive Subtitle -->
    <text x="0" y="152" class="subtitle-text">
      Curated Index of Corporate Cards, OCR Receipt Tracking,
    </text>
    <text x="0" y="180" class="subtitle-text">
      Employee Reimbursement Workflows &amp; Open-Source Engines
    </text>

    <!-- Highlight Metrics Badges -->
    <g transform="translate(0, 215)">
      <!-- Item 1 -->
      <g>
        <rect width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="12" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">💳 Corporate Cards</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(145, 0)">
        <rect width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="12" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🧾 Receipt OCR</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(290, 0)">
        <rect width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="12" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">⚡ Smart Approvals</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(445, 0)">
        <rect width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="12" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🌐 Open Source</text>
      </g>
    </g>
  </g>
</svg>
